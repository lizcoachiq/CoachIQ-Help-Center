name: Credential scan
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  credential-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Check changed commits for credentials
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # Only identifier/public-key exceptions; never allow actual credential literals.
          cat > "$RUNNER_TEMP/credential-scan.toml" <<'CONFIG'
          [extend]
          useDefault = true
          [[allowlists]]
          description = "UUID identifiers, public PostHog project tokens and environment references"
          regexTarget = "secret"
          regexes = [
            '''^[a-fA-F0-9]{8}(?:-[a-fA-F0-9]{4}){3}-[a-fA-F0-9]{12}$''',
            '''^phc_[A-Za-z0-9]+$''',
            '''^\$\{?[A-Z][A-Z0-9_]*\}?$''',
          ]
          CONFIG
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            RANGE="$BASE_SHA..$HEAD_SHA"
          elif [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            RANGE="$BEFORE_SHA..$HEAD_SHA"
          else
            # New branches/manual runs check the current tracked snapshot.
            # Historical audits are separate from this new-change check.
            mkdir "$RUNNER_TEMP/credential-snapshot"
            git archive "$HEAD_SHA" | tar -x -C "$RUNNER_TEMP/credential-snapshot"
            "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/credential-snapshot" \
              --config "$RUNNER_TEMP/credential-scan.toml" --redact=100 --no-banner \
              --ignore-gitleaks-allow --gitleaks-ignore-path "$RUNNER_TEMP/no-ignores"
            exit
          fi
          "$RUNNER_TEMP/gitleaks" git --log-opts="$RANGE" \
            --config "$RUNNER_TEMP/credential-scan.toml" --redact=100 --no-banner \
            --ignore-gitleaks-allow --gitleaks-ignore-path "$RUNNER_TEMP/no-ignores"
